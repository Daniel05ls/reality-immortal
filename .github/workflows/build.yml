name: Build Minecraft Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build mod
        # Validate data resources as well as compiling Java.
        run: |
          python3 tools/verify_resources.py
          gradle --no-daemon build --stacktrace
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: reality-immortal-1.21.1
          path: build/libs/reality-immortal-1.2.2.jar
          if-no-files-found: error
          retention-days: 30
